<title>__TITLE__</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>/*KIT_CSS*/</style>
<style>
/* Trang kế hoạch: bố cục bản "Một nấc" thien chọn ở vòng gu 1 (2026-11-18): một cột đọc, toàn cảnh trước,
   tuyến checkpoint kiểu tuyến tàu, phương án, câu hỏi trả lời bằng nút. Màu, chữ, bo góc là của kit;
   mực hình theo nghĩa: xanh (--ink-1) cho ga đã xong, cam (--ink-2) cho ga đang chạy và việc thien cần làm.
   Chi tiết thử: bản đồ ga theo ngày kèm núm vặn, lấy từ bản Thật xa nhưng nền sáng, chữ cỡ thường. */
:root { --toc-h: 48px; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
body { font-size: 15.5px; line-height: 1.6; overflow-wrap: break-word; }
.wrap a, .wrap code { overflow-wrap: anywhere; }
h1 { font-size: 28px; line-height: 1.2; letter-spacing: -.02em; text-wrap: balance; }
h2 { font-size: 20px; line-height: 1.3; letter-spacing: -.01em; text-wrap: balance; }
h3 { font-size: 16px; line-height: 1.35; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.small { font-size: 14px; }
.wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 64px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 40px; }
section, header.ph { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; scroll-margin-top: calc(var(--toc-h) + 12px); }
.stop { scroll-margin-top: calc(var(--toc-h) + var(--map-h, 0px) + 16px); }
.pad { padding: 14px 16px; display: grid; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 4px; }

/* Mục lục: thanh dính trên cùng ở điện thoại và máy tính bảng; JS đo chiều cao thật vào --toc-h để nhảy tới mục không bị che.
   Màn rộng (từ 1160px): thành cột bên trái, tận dụng khoảng trống hai bên cột đọc; --toc-h về 0 (lời thien 19/11). */
nav.toc { position: sticky; top: 0; z-index: 6; background: color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
nav.toc .in { max-width: 760px; margin: 0 auto; padding: 6px 12px; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav.toc a { font: 500 13.5px/1 var(--font); color: var(--muted); text-decoration: none; padding: 10px 10px; border-radius: var(--r); white-space: nowrap; }
nav.toc a:hover { color: var(--ink); }
nav.toc a.on { background: var(--card); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
nav.toc { transition: transform var(--t-base) var(--ease-out); }
nav.toc.away { transform: translateY(-100%); }
html.toc-away .mapmini { top: 8px; }
@media (prefers-reduced-motion: reduce) { nav.toc { transition: none; } }
.side-prog { display: none; }
@media (min-width: 1160px) {
  nav.toc, nav.toc.away { transform: none; }
  nav.toc { position: fixed; top: 0; bottom: 0; left: max(8px, calc(50% - 380px - 196px)); width: 180px; padding: 32px 0;
    background: none; backdrop-filter: none; -webkit-backdrop-filter: none; border: 0; display: flex; flex-direction: column; gap: 24px; }
  nav.toc .in { flex-direction: column; margin: 0; padding: 0; gap: 0; overflow: visible; }
  nav.toc a { padding: 9px 12px; border-left: 2px solid var(--line); border-radius: 0 var(--r) var(--r) 0; white-space: normal; line-height: 1.3; }
  nav.toc a.on { box-shadow: none; border-left-color: var(--accent); background: var(--card); color: var(--ink); font-weight: 600; }
  .side-prog { display: grid; gap: 6px; padding-left: 14px; color: var(--muted); }
}

/* Đầu trang */
.lead { font-size: 17px; max-width: 64ch; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; }
.prog { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
.prog .mono { font-size: 12.5px; color: var(--muted); }

/* Đang ở đâu */
.where { display: grid; }
.w-row { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 12px; padding: 12px 16px; }
.w-row + .w-row, .where > .w-more { border-top: 1px solid var(--line); }
.where > .w-more { border-radius: 0; border-left: 0; border-right: 0; border-bottom: 0; }
.where > .w-more summary { padding-left: 16px; padding-right: 16px; }
.where > .w-more .list { padding: 0 16px 12px 34px; }
.w-row .label { padding-top: 3px; }
.w-row.ask { background: color-mix(in srgb, var(--ink-2) 6%, var(--card)); }
@media (max-width: 560px) { .w-row { grid-template-columns: minmax(0, 1fr); gap: 2px; } }
.jump { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 44px; padding: 8px 14px; border: 1px solid var(--line);
  border-radius: var(--r); background: var(--card); color: var(--ink); text-decoration: none; font-size: 14.5px; }
.jump:hover { border-color: var(--ink-2); }
.jump b { font-weight: 600; }
.jump .ic { color: var(--ink-2); flex: none; }

/* Bản đồ ga theo ngày (chi tiết thử): bản đầy đủ nằm yên đầu tuyến, có núm vặn; cuộn qua thì bản gọn hiện dính dưới mục lục,
   cách mục lục 8px, chỉ còn chấm và tên ga đang đọc, để chỗ cho nội dung từng ga (lời thien 19/11). */
.daymap { padding: 10px 12px 8px; display: grid; gap: 6px; }
.daymap svg { width: 100%; height: 84px; display: block; overflow: visible; }
.mapmini { position: fixed; z-index: 5; top: calc(var(--toc-h) + 8px); left: 50%; width: min(728px, calc(100vw - 24px)); padding: 6px 12px 6px;
  box-shadow: var(--shadow-pop); opacity: 0; visibility: hidden; transform: translate(-50%, -6px);
  transition: opacity var(--t-base) var(--ease-out), transform var(--t-base) var(--ease-out), top var(--t-base) var(--ease-out), visibility 0s linear var(--t-base); }
.mapmini.on { opacity: 1; visibility: visible; transform: translate(-50%, 0); transition-delay: 0s; }
.mapmini svg { width: 100%; height: 34px; display: block; overflow: visible; }
.mini-cap { min-height: 1.5em; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini-cap b { color: var(--ink); font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .mapmini { transition: none; } }
.daymap .axis, .mapmini .axis { stroke: var(--line-strong); stroke-width: 2; }
.daymap .done-track, .mapmini .done-track { stroke: var(--ink-1); stroke-width: 3; }
.daymap .tick line { stroke: var(--line-strong); }
.daymap text { font: 500 11px var(--mono); fill: var(--muted); }
.daymap .today line, .mapmini .today line { stroke: var(--accent); stroke-dasharray: 3 4; }
.daymap .today text { fill: var(--accent-ink); font-weight: 600; }
.daymap .st, .mapmini .st { cursor: pointer; }
.daymap .st circle.c, .mapmini .st circle.c { fill: var(--card); stroke: var(--line-strong); stroke-width: 2; }
.daymap .st text.n, .mapmini .st text.n { font: 700 11px var(--mono); fill: var(--muted); text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.daymap .st.done circle.c, .mapmini .st.done circle.c { fill: var(--ink-1); stroke: var(--ink-1); }
.daymap .st.done text.n, .mapmini .st.done text.n { fill: var(--on-fill); }
.daymap .st.now circle.c, .mapmini .st.now circle.c { stroke: var(--ink-2); }
.daymap .st.now text.n, .mapmini .st.now text.n { fill: var(--ink-2); }
.daymap .st.gate circle.c, .mapmini .st.gate circle.c { stroke-dasharray: 3 3; stroke: var(--warn); }
.daymap .st.sel circle.c, .mapmini .st.sel circle.c { stroke-width: 3; }
.daymap .st.sel text.d { fill: var(--ink); font-weight: 700; }
.knob { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; font-size: 14px; }
.knob[hidden] { display: none; }
.knob input { width: 100%; accent-color: var(--accent); min-height: 32px; }
.readout { font-size: 13.5px; color: var(--muted); min-height: 1.5em; }
.readout b { color: var(--ink); font-weight: 600; }
@media (max-width: 560px) { .daymap { padding: 8px 10px 6px; gap: 2px; } .knob { font-size: 13.5px; gap: 10px; } .readout { font-size: 13px; } }

/* Tuyến checkpoint kiểu tuyến tàu */
ol.line { list-style: none; margin: 0; padding: 0; display: grid; }
.stop { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 12px; position: relative; padding-bottom: 18px; }
.stop::before { content: ""; position: absolute; left: 19px; top: 40px; bottom: 0; width: 2px; background: var(--line); }
.stop:last-child::before { display: none; }
.stop.done::before { background: var(--ink-1); }
.stop.now::before { background: linear-gradient(var(--ink-2), var(--line)); }
.dot { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--card); display: grid; place-items: center;
  font: 600 14px/1 var(--mono); color: var(--muted); position: relative; z-index: 1; }
.stop.done .dot { background: var(--ink-1); border-color: var(--ink-1); color: var(--on-fill); }
.stop.now .dot { border-color: var(--ink-2); color: var(--ink-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ink-2) 16%, transparent); }
.stop.gate:not(.done) .dot { border-style: dashed; border-color: var(--warn); color: var(--warn); }
.stop.dropped .dot { border-style: dotted; }
.stop.dropped h3 { text-decoration: line-through; color: var(--muted); }
.stop.sel:not(.now) .dot { outline: 2px solid var(--accent); outline-offset: 3px; }
.stop .box { display: grid; gap: 8px; padding-top: 7px; min-width: 0; }
.stop .head { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: baseline; }
.stop .chips { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.done-when { font-size: 14px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; }
.done-when b { color: var(--ink-1); font-weight: 600; }
.stop.now .done-when b { color: var(--ink-2); }
.stop .acc summary { font-size: 14px; }
ul.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
ul.tasks li { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; }
ul.tasks .tick { width: 18px; height: 18px; margin-top: 2px; border: 1.5px solid var(--line-strong); border-radius: 5px; display: grid; place-items: center; font-size: 12px; }
ul.tasks li.done .tick { background: var(--ink-1); border-color: var(--ink-1); color: var(--on-fill); }
ul.tasks li.done > span:last-child { color: var(--muted); }
.legend { margin-top: -4px; }
.legend .lg { width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line-strong); background: var(--card); }
.legend .lg.done { background: var(--ink-1); border-color: var(--ink-1); }
.legend .lg.now { border-color: var(--ink-2); }
.legend .lg.gate { border-style: dashed; border-color: var(--warn); }

/* Phương án */
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 12px; padding: 14px; }
.opt.pick { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.opt .k { font: 600 15px/34px var(--mono); width: 34px; height: 34px; text-align: center; border-radius: var(--r); background: var(--soft); color: var(--muted); }
.opt.pick .k { background: var(--accent-fill); color: var(--on-accent); }
.opt .c { display: grid; gap: 6px; font-size: 14px; min-width: 0; }
.opt .t { font-size: 15.5px; font-weight: 600; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.opt dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; }
.opt dt { color: var(--muted); }
.opt dd { margin: 0; }
@media (max-width: 480px) { .opt dl { grid-template-columns: 1fr; } .opt dt { margin-top: 4px; } }
.list { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14.5px; }

/* Câu hỏi và góp ý */
.qs { display: grid; gap: 16px; }
.qs:empty { display: none; }
.q { display: grid; gap: 8px; border: 0; margin: 0; padding: 0; min-width: 0; }
.q legend { font-weight: 600; font-size: 15.5px; padding: 0; margin-bottom: 8px; }
.q .opts2 { display: grid; gap: 6px; }
/* .choice, .trial, ô chữ, nút và dòng báo của khối gửi: trong kit.css (KH9). */
.preview { white-space: pre-wrap; font-size: 13.5px; color: var(--muted); background: var(--soft); border-radius: var(--r); padding: 10px 12px; }

/* Thêm, nhật ký */
.accs { display: grid; }
.md { display: grid; gap: 10px; font-size: 14.5px; }
.md ul, .md ol { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.md h4 { font-size: 15px; margin-top: 4px; }
.table { overflow-x: auto; }
.table table { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 480px; }
.table th, .table td { text-align: left; vertical-align: top; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.table th { color: var(--muted); font-weight: 600; }
footer { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
</style>

<!--BODY-->

<script>/*KIT_JS*/</script>
