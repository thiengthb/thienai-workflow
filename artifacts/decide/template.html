<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>/*KIT_CSS*/</style>
<style>
/* Bố cục (thien chọn ở vòng decide-layout-r1 và decide-image-r1): khung rộng là một ảnh lớn mỗi lần (tab để
   chuyển bản) và bảng so sánh gọn bên dưới; khung hẹp (điện thoại) là thẻ xếp dọc, ảnh đủ tỉ lệ.
   Cùng một dữ liệu, cùng một lựa chọn. */
body { font-size: 0.9667rem; }
main { max-width: 1180px; margin: 0 auto; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 16px; }
.head { display: grid; gap: 4px; }
.head h1 { font-size: 1.4667rem; }
.head .why { color: var(--muted); max-width: 80ch; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); }
.shot { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: var(--r); background: var(--soft); overflow: hidden; cursor: zoom-in; position: relative; }
.shot img { display: block; width: 100%; height: auto; object-fit: cover; object-position: top; }
.shot .zoom-hint { position: absolute; right: 6px; bottom: 6px; font: 600 0.7667rem/1 var(--font); padding: 4px 6px; border-radius: var(--r); background: color-mix(in srgb, var(--card) 88%, transparent); color: var(--muted); }
.pc { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 0.9rem; }
.pc li { display: grid; grid-template-columns: 14px 1fr; gap: 6px; }
.pc li::before { font-weight: 700; }
.pc .p::before { content: "+"; color: var(--good); }
.pc .c::before { content: "−"; color: var(--bad); }
.lk { list-style: none; margin: 0; padding: 10px 0 0; border-top: 1px solid var(--line); display: grid; gap: 8px; font-size: 0.9rem; }
.lk li { display: grid; gap: 2px; }
.lk a { color: var(--accent-ink); font-weight: 600; }
.pick[aria-pressed="true"] { background: var(--accent-fill); border-color: var(--accent-edge); color: var(--on-accent); }
.chosen { box-shadow: inset 0 0 0 2px var(--accent); }

/* Xem từng bản (khung rộng): tab, ảnh lớn bên trái, ưu nhược và nút chọn bên phải */
.stage { overflow: hidden; }
.stage .tabs { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
.stage .tabs button { display: inline-flex; align-items: center; gap: 6px; font: 500 0.9rem/1.2 var(--font); padding: 6px 12px; border-radius: var(--r); border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; }
.stage .tabs button:hover { color: var(--ink); }
.stage .tabs button[aria-selected="true"] { background: var(--soft); border-color: var(--line); color: var(--ink); }
.stage .tabs .mk { font-size: 0.7667rem; font-weight: 600; color: var(--accent-ink); }
.stage .pane { display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
.stage .pane[hidden] { display: none; }
.stage .im { display: grid; place-items: center; padding: 12px; background: var(--soft); border-right: 1px solid var(--line); min-height: 240px; }
.stage .im .shot { width: auto; max-width: 100%; }
.stage .im .shot img { width: auto; max-width: 100%; max-height: min(64vh, 520px); }
.stage .im .none { color: var(--muted); font-size: 0.8667rem; }
.stage .side { display: grid; gap: 10px; align-content: start; padding: 14px; }
.stage .side h2 { font-size: 1.0667rem; }
.stage .side .btn { width: 100%; }
.stage .nav { display: flex; gap: 8px; }
/* Khung vừa (máy tính bảng, cửa sổ hẹp): ảnh lên trên đủ rộng, chữ xuống dưới, để ảnh không bé lại bằng con tem. */
@media (max-width: 999px) { .stage .pane { grid-template-columns: minmax(0, 1fr); } .stage .im { border-right: 0; border-bottom: 1px solid var(--line); }
  .stage .im .shot img { max-height: min(70vh, 640px); } .stage .side .btn { width: auto; } .stage .side .pick { width: 100%; } }
.stage .keys { margin-left: auto; align-self: center; font-size: 0.8333rem; color: var(--muted); }
.stage .keys kbd, .zfoot kbd { font: 600 0.7667rem var(--mono); padding: 1px 5px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--card); }
@media (pointer: coarse) { .stage .keys { display: none; } }

/* Bảng so sánh (khung rộng, dưới phần xem từng bản) */
.tbl { overflow-x: auto; }
.tbl table { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 600px; }
.tbl col:first-child { width: 150px; }
.tbl th, .tbl td { text-align: left; vertical-align: top; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.tbl thead th { font-weight: 400; }
.tbl thead th:first-child, .tbl tbody th { width: 150px; color: var(--muted); font-weight: 500; font-size: 0.8667rem; }
.tbl thead b { display: block; font-size: 1rem; }
.tbl tr.picks td, .tbl tr.picks th { border-bottom: 0; }
.tbl tr.picks .btn { width: 100%; }
.tbl col.chosen-col { background: var(--accent-soft); }

/* Thẻ (khung hẹp) */
.cards { display: grid; gap: 12px; }
.opt { display: grid; }
.opt .shot { border-width: 0 0 1px; border-radius: var(--r) var(--r) 0 0; }
.opt .shot img { max-height: 72vh; }
.opt .ob { display: grid; gap: 8px; padding: 12px 14px; }
.opt h2 { font-size: 1.0667rem; }
.opt .crit { display: flex; flex-wrap: wrap; gap: 6px; }
.opt .crit span { font-size: 0.8333rem; color: var(--muted); }
.opt .of { padding: 10px 14px; border-top: 1px solid var(--line); }
.opt .of .btn { width: 100%; }
.opt.chosen { border-color: var(--accent); box-shadow: none; }

.view-cards { display: none; }
@media (max-width: 759px) { .view-table { display: none; } .view-cards { display: grid; } }

/* Đề xuất của Claude, ẩn tới khi chọn */
/* Nhiều câu trên một trang: thanh câu (nút đánh số, chữ bản đã chọn), rồi tên câu đang xem. */
.parts { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; }
.parts[hidden], .pq[hidden] { display: none; }
.part { display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px; align-items: center; text-align: left; font: inherit; color: var(--ink);
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 8px 12px; min-height: 52px; cursor: pointer; }
.part:hover { border-color: var(--line-strong); }
.part .pn { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--line-strong); font: 600 0.8667rem var(--mono); color: var(--muted); }
.part.done .pn { background: var(--ink-1); border-color: var(--ink-1); color: var(--on-fill); }
.part[aria-current] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.part .pt { display: grid; font-size: 0.8667rem; line-height: 1.35; }
.part .pt b { font-size: 0.9333rem; font-weight: 600; }
.pq { display: grid; gap: 2px; }
.pq h2 { font-size: 1.2rem; }
.pq .why { color: var(--muted); max-width: 80ch; }
.rec .next { margin-left: 8px; margin-top: 6px; }
@media (max-width: 480px) { .part { grid-template-columns: 1fr; justify-items: start; gap: 4px; padding: 8px 10px; } .part .pt b { font-size: 0.9rem; } }
.rec { display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px; border: 1px dashed var(--line); border-radius: var(--r); color: var(--muted); font-size: 0.9rem; }
.rec .ri { flex: none; width: 16px; height: 16px; margin-top: 2px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.rec.open { border-style: solid; background: var(--card); color: var(--ink); }
.rec.open b { font-weight: 600; }
.rec .same { color: var(--good); font-weight: 600; }

.ai-ask { padding: 12px 14px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.ask { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px 10px; align-items: end; padding: 12px 14px; }
.ask .label { grid-column: 1 / -1; }
.ask textarea { width: 100%; min-height: 44px; resize: vertical; }
.ask .acts { display: flex; gap: 8px; }
@media (max-width: 640px) { .ask { grid-template-columns: 1fr; } .ask .acts .btn { flex: 1; } }
.status { font-size: 0.8667rem; color: var(--muted); }

/* Hộp phóng to: gần kín màn; đầu là tên bản và nút (bản trước, bản sau, nấc phóng, đóng), giữa là ảnh cuộn được. */
dialog#zoom { width: calc(100vw - 16px); max-width: 1600px; height: calc(100dvh - 16px); max-height: none; padding: 0; border: 1px solid var(--line); border-radius: var(--r);
  background: var(--card); color: var(--ink); overflow: hidden; }
dialog#zoom[open] { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; }
dialog#zoom::backdrop { background: var(--scrim); }
dialog#zoom .zh { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--line); }
dialog#zoom .zt { display: grid; margin-right: auto; min-width: 0; }
dialog#zoom .zt b { font-size: 1rem; } dialog#zoom .zt span { font-size: 0.8333rem; color: var(--muted); }
dialog#zoom .zc { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
dialog#zoom .zc .btn { min-height: 40px; min-width: 40px; padding: 0 10px; }
dialog#zoom .zc .lv { min-width: 96px; font-variant-numeric: tabular-nums; }
dialog#zoom .zc .gap { width: 1px; height: 24px; background: var(--line); margin: 0 2px; }
.zb { overflow: auto; background: var(--soft); outline: none; overscroll-behavior: contain; touch-action: pan-x pan-y pinch-zoom; }
.zb:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
.zb img { display: block; max-width: none; height: auto; margin: 0 auto; user-select: none; -webkit-user-drag: none; }
.zb.fit { display: grid; place-items: center; padding: 8px; cursor: zoom-in; }
.zb.fit img { width: auto; max-width: 100%; max-height: 100%; object-fit: contain; }
.zb:not(.fit) { cursor: grab; } .zb.drag { cursor: grabbing; }
.zfoot { padding: 6px 14px; font-size: 0.8333rem; color: var(--muted); border-top: 1px solid var(--line); }
@media (pointer: coarse) { .zfoot .keys { display: none; } }
@media (pointer: fine) { .zfoot .touch { display: none; } }
@media (max-width: 560px) { dialog#zoom { width: 100vw; height: 100dvh; border-radius: 0; border: 0; } dialog#zoom .zc .lv { min-width: 0; } }
</style>

<main>
  <header class="head">
    <span class="label" id="count"></span>
    <h1 id="q"></h1>
    <p class="why" id="why"></p>
  </header>
  <nav class="parts" id="parts" aria-label="Các câu cần chọn" hidden></nav>
  <div class="pq" id="pq" hidden><h2 id="pq-t"></h2><p class="why" id="pq-why"></p></div>
  <section class="view-table card stage" id="stage" data-area="stage" aria-label="Xem từng phương án"></section>
  <section class="view-table card tbl" id="table" data-area="table" aria-label="Bảng so sánh"></section>
  <section class="view-cards cards" id="cards" data-area="cards" aria-label="Các phương án"></section>
  <div class="rec" id="rec" role="status" aria-live="polite"></div>
  <!-- Hỏi Claude về các phương án (Kit.ask, khả năng sample). Chỉ hiện khi trang hỏi được. -->
  <div class="card ai-ask kit-ask">
    <label class="label" for="ai-q">Hỏi Claude về các phương án</label>
    <form class="ai-form" id="ai-form"><input id="ai-q" type="text" maxlength="300" placeholder="Hỏi Claude, ví dụ: B khác C ở chỗ nào?" aria-label="Câu hỏi cho Claude về các phương án"><button class="btn" type="submit" id="ai-send">Hỏi</button></form>
    <p class="ai-out" id="ai-out" role="status"></p>
  </div>
  <div class="card ask">
    <label class="label" for="note">Ghi chú (không bắt buộc)</label>
    <textarea id="note" maxlength="3000" disabled placeholder="Ví dụ: lấy C nhưng thêm phần thanh bước của B"></textarea>
    <div class="acts">
      <button class="btn" id="copy" type="button" disabled>Chép kết quả</button>
      <button class="btn accent" id="send" type="button" disabled>Gửi cho Claude</button>
    </div>
    <p class="status" id="status"></p>
  </div>
</main>
<dialog id="zoom" aria-labelledby="zoom-t">
  <div class="zh">
    <div class="zt"><b id="zoom-t"></b><span id="zoom-n"></span></div>
    <div class="zc" role="group" aria-label="Điều khiển ảnh">
      <button class="btn" id="zoom-prev" type="button" aria-label="Bản trước" title="Bản trước (←)">←</button>
      <button class="btn" id="zoom-next" type="button" aria-label="Bản sau" title="Bản sau (→)">→</button>
      <span class="gap" aria-hidden="true"></span>
      <button class="btn" id="zoom-out" type="button" aria-label="Thu nhỏ" title="Thu nhỏ (−)">−</button>
      <button class="btn lv" id="zoom-lv" type="button" title="Vừa khung hay 200% (0)" aria-label="Đổi giữa vừa khung và 200%">Vừa khung</button>
      <button class="btn" id="zoom-in" type="button" aria-label="Phóng to" title="Phóng to (+)">+</button>
      <button class="btn" id="zoom-x" type="button">Đóng</button>
    </div>
  </div>
  <div class="zb fit" id="zoom-body" tabindex="0" aria-label="Ảnh phóng to, cuộn hay kéo để xem chỗ khác"><img id="zoom-img" alt="" draggable="false"></div>
  <p class="zfoot"><span class="keys"><kbd>←</kbd> <kbd>→</kbd> đổi bản · <kbd>+</kbd> <kbd>−</kbd> phóng, <kbd>0</kbd> vừa khung · bấm đúp hay Ctrl + lăn chuột để phóng chỗ đó · kéo để xem chỗ khác · <kbd>Esc</kbd> đóng</span><span class="touch">Vuốt ngang để đổi bản · bấm nút + để phóng, rồi kéo để xem chỗ khác</span></p>
  <p class="vh" id="zoom-live" role="status" aria-live="polite"></p>
</dialog>

<script type="application/json" id="decision">__DECISION__</script>
<script>/*KIT_JS*/</script>
<script>/*DECIDE_JS*/</script>
