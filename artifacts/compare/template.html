<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>/*KIT_CSS*/</style>
<style>
/* Bố cục A "Gọn lại" (vòng compare-redesign-r1, 2026-11-14): đầu trang một dòng, giới thiệu gập vào "Về vòng này",
   cột trái là danh sách màn có chấm trạng thái, một hàng công cụ, ảnh, rồi thanh phán xét dính ở đáy.
   Ảnh hẹp (điện thoại) thì để cạnh nhau; ảnh rộng (laptop) hoặc màn hẹp thì tự xem từng bản cho to. */
[hidden] { display: none !important; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { position: relative; z-index: 8; padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--card); }
.top-in { max-width: 1680px; margin: 0 auto; display: flex; gap: 12px; align-items: center; }
.top h1 { flex: 1 1 auto; min-width: 0; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prog { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.prog .bar { width: 110px; }
#about-btn[aria-expanded="true"] { background: var(--soft); }
#about { max-width: 1680px; margin: 10px auto 0; display: grid; gap: 8px; font-size: 14px; }
#about[hidden] { display: none; }
#about p { max-width: 80ch; }
.about-copy { display: none; }
.scen { margin: 0; padding-left: 18px; font-size: 13px; color: var(--muted); display: grid; gap: 2px; }
.wrap { max-width: 1680px; margin: 0 auto; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px));
  display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 20px; align-items: start; }
aside { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: calc(100vh - 24px); overflow: auto; display: grid; gap: 14px; padding: 12px 0 8px; }
.side-block { display: grid; gap: 8px; }
.items { display: grid; gap: 2px; }
.grp { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 8px 0 2px; }
.item { display: flex; gap: 8px; align-items: center; text-align: left; width: 100%; min-height: 34px;
  background: transparent; border: 0; border-radius: var(--r); padding: 6px 8px; cursor: pointer; color: var(--ink); font: 500 13.5px/1.3 var(--font); }
.item:hover { background: var(--soft); }
.item[aria-current="true"] { background: var(--soft); font-weight: 600; }
.item .nm { min-width: 0; overflow-wrap: anywhere; }
.item .pf { margin-left: auto; font-size: 11.5px; color: var(--accent-ink); white-space: nowrap; }
.sdot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.sdot.ok { background: var(--good); } .sdot.fix { background: var(--bad); }
main { min-width: 0; display: grid; gap: 10px; }
.tools { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); padding: 10px 0; display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; }
.tools .grow { flex: 1 1 auto; }
.more { position: relative; }
.more > summary { list-style: none; cursor: pointer; }
.more > summary::-webkit-details-marker { display: none; }
.more[data-on="true"] > summary { border-color: var(--ink); }
.menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 9; display: grid; gap: 2px; padding: 4px; min-width: 180px; box-shadow: var(--shadow); }
.menu button { text-align: left; justify-content: flex-start; border: 0; background: transparent; }
.menu button:hover { background: var(--soft); }
.menu button[aria-pressed="true"] { background: var(--soft); font-weight: 600; }
.picker { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
select { font: 500 13px var(--font); color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: var(--r); min-height: 30px; padding: 0 8px; }
#pin[aria-pressed="true"] { background: var(--accent); border-color: color-mix(in srgb, var(--accent) 75%, #000); color: #fff; }
.hint { font-size: 13px; color: var(--muted); margin-top: -4px; }
.hint:empty { display: none; }
.hint b { color: var(--ink); font-weight: 600; }
.cur-note { font-size: 13.5px; color: var(--muted); margin-top: -4px; }
.cur-note:empty { display: none; }
#stage { position: relative; min-height: 200px; }
.scroll { overflow-x: auto; }
.sbs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.sbs.zoomed { grid-template-columns: max-content max-content; }
.col { display: grid; gap: 6px; min-width: 0; justify-items: center; }
.col > .cap { justify-self: stretch; }
.one { display: grid; gap: 8px; justify-items: center; }
.one > .seg { justify-self: start; }
.cap { display: flex; gap: 8px; align-items: center; font-size: 13px; font-weight: 600; }
.cap .dim { font-family: var(--mono); font-size: 11.5px; color: var(--muted); font-weight: 500; }
.shot { position: relative; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--card); line-height: 0; }
.shot img, .shot canvas { display: block; max-width: none; }
.ov { position: relative; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--card); }
.ov img, .ov canvas { position: absolute; left: 0; top: 0; max-width: none; display: block; }
.knob { position: absolute; top: 0; bottom: 0; width: 0; z-index: 3; }
.knob::before { content: ""; position: absolute; top: 0; bottom: 0; left: -1px; width: 2px; background: var(--accent); }
.knob button { position: sticky; top: 45vh; margin-left: -18px; width: 36px; height: 36px; border-radius: 50%; border: 2px solid var(--accent); background: var(--card);
  color: var(--accent-ink); font: 700 14px var(--font); cursor: ew-resize; touch-action: none; }
.tag { position: absolute; top: 8px; z-index: 2; font: 600 12px var(--font); padding: 3px 8px; border-radius: var(--r); background: var(--ink); color: var(--bg); line-height: 1.4; }
.tag.l { left: 8px; } .tag.r { right: 8px; }
.ctl { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.ctl input[type="range"] { width: min(280px, 50vw); accent-color: var(--accent); }
.note-diff { font-size: 13px; }
.commenting .shot, .commenting .ov { cursor: crosshair; }
#area { position: absolute; z-index: 4; border: 2px dashed var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent); pointer-events: none; }
.dot { position: absolute; z-index: 5; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50% 50% 50% 4px; background: var(--accent); color: #fff;
  border: 2px solid var(--card); font: 700 12px/22px var(--font); text-align: center; cursor: pointer; box-shadow: var(--shadow); padding: 0; }
#pop { position: absolute; z-index: 7; width: min(300px, calc(100vw - 32px)); padding: 10px; display: grid; gap: 8px; box-shadow: var(--shadow); }
#pop .row { display: flex; gap: 8px; justify-content: flex-end; }
.verdict { position: sticky; bottom: 0; z-index: 6; display: flex; gap: 8px; align-items: center; padding: 10px 0 calc(10px + env(safe-area-inset-bottom, 0px));
  background: var(--bg); border-top: 1px solid var(--line); }
.verdict .nm { font-weight: 600; font-size: 14px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 32ch; }
.verdict .grow { flex: 1 1 auto; }
.verdict .pos { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
#ok[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; }
#fix[aria-pressed="true"] { background: var(--bad); border-color: var(--bad); color: #fff; }
.gen textarea { min-height: 72px; resize: vertical; }
.empty { padding: 40px 16px; text-align: center; }
@media (max-width: 860px) {
  .wrap { grid-template-columns: minmax(0, 1fr); gap: 0; }
  aside { position: static; max-height: none; overflow: visible; padding: 8px 0 0; }
  .items { display: flex; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
  .grp { display: none; }
  .item { width: auto; flex: 0 0 auto; }
  .prog .bar, #copy, .verdict .nm, .verdict .pos { display: none; }
  .about-copy { display: block; }
  .tools { position: static; }
  .gen { margin: 8px 0 16px; }
}
@media (max-width: 480px) {
  .top-in { flex-wrap: wrap; gap: 8px; }
  .top h1 { flex-basis: 100%; }
  .prog { margin-right: auto; }
  #zooms, .tools .grow { display: none; }
  #prefer-box > span:first-child { display: none; }
  .verdict { gap: 6px; }
}
</style>

<header class="top" id="top">
  <div class="top-in">
    <h1 id="title"></h1>
    <button class="btn" id="about-btn" type="button" aria-expanded="false" aria-controls="about">Về vòng này</button>
    <span class="prog"><span class="bar"><span id="prog-bar" style="width:0"></span></span><span id="prog-text">0/0</span></span>
    <button class="btn" id="copy" type="button">Chép kết quả</button>
    <button class="btn primary" id="send" type="button">Gửi cho Claude</button>
  </div>
  <div id="about" hidden>
    <p class="muted" id="intro"></p>
    <ol class="scen" id="scen"></ol>
    <div class="about-copy"><button class="btn" id="copy2" type="button">Chép kết quả</button></div>
  </div>
</header>

<div class="wrap">
  <aside>
    <div class="side-block"><div class="items" id="items" aria-label="Các màn"></div></div>
    <div class="side-block gen">
      <label class="label" for="general">Ghi chú chung</label>
      <textarea id="general" maxlength="3000" placeholder="Điều muốn nói cho cả vòng, ví dụ: tổng thể bản mới thoáng hơn nhưng chữ nhỏ quá."></textarea>
    </div>
  </aside>

  <main>
    <div class="tools">
      <div class="seg" id="modes" role="group" aria-label="Kiểu xem">
        <button type="button" data-mode="side" aria-pressed="false">Cạnh nhau</button>
        <button type="button" data-mode="one" aria-pressed="false">Từng bản</button>
        <button type="button" data-mode="slide" aria-pressed="false">Trượt</button>
      </div>
      <details class="more" id="more"><summary class="btn">Thêm cách xem</summary>
        <div class="menu card" role="group" aria-label="Cách xem khác">
          <button class="btn" type="button" data-mode="onion" aria-pressed="false">Chồng mờ</button>
          <button class="btn" type="button" data-mode="blink" aria-pressed="false">Nháy qua lại</button>
          <button class="btn" type="button" data-mode="diff" aria-pressed="false">Tô chỗ khác nhau</button>
        </div>
      </details>
      <span class="picker" id="pickers" hidden>
        <label for="left-side">Trái</label><select id="left-side"></select>
        <label for="right-side">Phải</label><select id="right-side"></select>
      </span>
      <span class="grow"></span>
      <div class="seg" id="zooms" role="group" aria-label="Cỡ ảnh">
        <button type="button" data-zoom="0" aria-pressed="false">Vừa</button>
        <button type="button" data-zoom="1" aria-pressed="false">100%</button>
        <button type="button" data-zoom="2" aria-pressed="false">200%</button>
      </div>
      <button class="btn" id="pin" type="button" aria-pressed="false">Ghim</button>
    </div>
    <p class="cur-note" id="cur-note"></p>
    <p class="hint" id="hint"></p>
    <div id="stage"></div>
    <div class="verdict">
      <span class="nm" id="cur-name"></span>
      <button class="btn" id="ok" type="button" aria-pressed="false">OK</button>
      <button class="btn" id="fix" type="button" aria-pressed="false">Cần sửa</button>
      <span class="picker" id="prefer-box" hidden><span>Thích bản</span><span class="seg" id="prefer" role="group" aria-label="Thích bản nào"></span></span>
      <span class="grow"></span>
      <span class="pos" id="pos"></span>
      <button class="btn" id="prev" type="button" aria-label="Màn trước">‹</button>
      <button class="btn" id="next" type="button">Màn sau ›</button>
    </div>
  </main>
</div>

<script type="application/json" id="round">__ROUND__</script>
<script>/*KIT_JS*/</script>
<script>/*COMPARE_JS*/</script>
