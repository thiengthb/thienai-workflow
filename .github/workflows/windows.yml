# thien works on a Windows laptop; CI's main job runs on Linux. Path and line-ending bugs (C:\ read as a URL,
# CRLF breaking Markdown parsers) only show up on Windows, so the script tests also run there.
# Only when scripts change: Windows minutes count double on a private repo.
name: Windows

on:
  pull_request:
    paths: ['**/*.mjs', '**/*.cjs', '**/*.js', '.gitattributes', '.github/workflows/windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - run: git config --global core.autocrlf true   # like a default Git for Windows install
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Script tests (no browser)
        shell: bash
        run: |
          fail=0
          for t in .github/scripts/*.test.mjs; do
            case "$t" in *ask-prompts*|*autosave*|*lesson-claude*|*sandtable-kinds*) continue;; esac   # need Playwright, run on Linux
            echo "== $t"; node "$t" || { echo "::error::$t failed"; fail=1; }
          done
          node artifacts/lesson/after-lesson.mjs --check-all || fail=1
          node templates/check-status.mjs docs/STATUS.md || fail=1
          node .github/scripts/check-links.mjs || fail=1
          node .github/scripts/check-lesson-sources.mjs || fail=1
          exit $fail
