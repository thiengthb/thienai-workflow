# Runs the repo's own tests on every PR, so a broken sync script is caught
# before it is merged and pushed out to other repos.
name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read   # check-status --prs reads the open PR list

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check-lesson-sources --pr compares with the PR base
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node .github/scripts/sync-agents-md.test.mjs
      - run: node .github/scripts/check-status.test.mjs
      - run: node .github/scripts/progress-page.test.mjs
      - run: node .github/scripts/cli-paths.test.mjs
      - run: node .github/scripts/make-round.test.mjs
      - run: node .github/scripts/make-decision.test.mjs
      - run: node .github/scripts/make-plan.test.mjs
      - run: node .github/scripts/make-flow.test.mjs
      - run: node .github/scripts/make-lesson.test.mjs
      - run: node .github/scripts/war-lesson.test.mjs
      - run: node .github/scripts/publish-progress.test.mjs
      - run: node .github/scripts/make-review.test.mjs
      - run: node .github/scripts/after-lesson.test.mjs
      - run: node .github/scripts/prepare-lesson.test.mjs
      - run: node .github/scripts/learning-week.test.mjs
      - run: node .github/scripts/check-open-work.test.mjs
      - run: node .github/scripts/handoff.test.mjs
      - run: node .github/scripts/setup-check.test.mjs
      - run: node .github/scripts/start-session.test.mjs
      - run: node .github/scripts/check-tokens.test.mjs
      - run: node .github/scripts/pack.test.mjs
      - run: node .github/scripts/pack-skills.test.mjs
      - run: node .github/scripts/crlf.test.mjs
      - run: node .github/scripts/check-links.test.mjs
      - run: node .github/scripts/check-lesson-sources.test.mjs
      # Lesson pages in the repo are sources (no kit filled in); a PR doesn't mix a lesson with a kit change.
      - run: node .github/scripts/check-lesson-sources.mjs ${BASE:+--pr "$BASE" --title "$TITLE"}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          TITLE: ${{ github.event.pull_request.title }}
      - run: node .github/scripts/check-links.mjs
      - run: node .github/scripts/reading-cost.test.mjs
      - run: node .github/scripts/reading-cost.mjs   # fails when one task needs more than the budget in that file
      - run: node artifacts/lesson/after-lesson.mjs --check-all
      - run: node templates/check-status.mjs docs/STATUS.md --git --prs --cards learning/cards.md
        env:
          GH_TOKEN: ${{ github.token }}

  # Opens the lesson pages changed in the PR (every page on main), one page built from each artifact template and the
  # component gallery in a real browser (3 widths, dark and light), and checks the prompts pages send to Claude.
  # Finished lessons are frozen: their published page is the record, so they are not re-checked against a new kit.
  # Screenshots are
  # attached to the run as "page-screenshots". axe-core adds WCAG 2.1 AA checks (serious and critical fail the run).
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # check-pages --changed compares with the PR base
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock playwright@1.63.0 axe-core@4.14.0
      - run: npx playwright install --with-deps chromium
      - run: node .github/scripts/ask-prompts.test.mjs
      - run: node .github/scripts/autosave.test.mjs
      - run: node .github/scripts/sandtable-kinds.test.mjs
      - run: node .github/scripts/grid2-axis.test.mjs
      - run: node .github/scripts/lesson-claude.test.mjs
      - run: node .github/scripts/end-card.test.mjs
      - run: node .github/scripts/bench-compare.test.mjs
      - run: node .github/scripts/kit-blocks.test.mjs
      - run: node artifacts/kit/check-pages.mjs --out .check-pages ${BASE:+--changed "$BASE"}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-screenshots
          path: .check-pages
          retention-days: 14
