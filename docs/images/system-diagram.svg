<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 592" width="400" height="592" role="img" aria-labelledby="t d">
  <title id="t">Sơ đồ hệ thống thienai-workflow</title>
  <desc id="d">thien nhắn việc ở chat điều phối, chat mở một thread cho từng việc. Thread đọc luật trong repo thienai-workflow và ghi lại qua PR, thien merge. Từ repo, một lệnh dựng lại các trang trên claude.ai, và luật chung tự đồng bộ sang repo các project khác.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #24292f; }
    .muted { fill: #57606a; }
    .label { font-size: 11px; font-weight: 600; letter-spacing: .06em; fill: #57606a; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13.5px; font-weight: 600; }
    .card, .chip, .pill { fill: none; stroke: #24292f; stroke-width: 1.2; }
    .line { stroke: #24292f; fill: none; stroke-width: 1.2; }
    .head { fill: #24292f; }
    .pill-t { fill: #24292f; }
    .sep { stroke: #d0d7de; }
    @media (prefers-color-scheme: dark) {
      text, .head, .pill-t { fill: #e6edf3; }
      .muted, .label { fill: #9198a1; }
      .card, .chip, .pill, .line { stroke: #e6edf3; }
      .sep { stroke: #3d444d; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" class="line"/>
    </marker>
  </defs>

  <!-- thien -->
  <rect class="pill" x="150" y="12" width="100" height="36" rx="4"/>
  <text class="pill-t" x="200" y="35" text-anchor="middle" font-size="15" font-weight="600">thien</text>
  <line class="line" x1="200" y1="48" x2="200" y2="88" marker-end="url(#a)"/>
  <text class="muted" x="212" y="73" font-size="13">nhắn việc</text>

  <!-- Claude -->
  <rect class="card" x="16" y="94" width="368" height="100" rx="4"/>
  <text class="label" x="32" y="118">CLAUDE TRÊN CLAUDE.AI</text>
  <rect class="chip" x="32" y="130" width="148" height="48" rx="4"/>
  <text x="106" y="159" text-anchor="middle" font-size="14.5" font-weight="600">Chat điều phối</text>
  <line class="line" x1="184" y1="154" x2="212" y2="154" marker-end="url(#a)"/>
  <rect class="chip" x="220" y="130" width="148" height="48" rx="4"/>
  <text x="294" y="151" text-anchor="middle" font-size="14.5" font-weight="600">Thread</text>
  <text class="muted" x="294" y="168" text-anchor="middle" font-size="12">mỗi việc một thread</text>

  <!-- Claude <-> repo -->
  <line class="line" x1="200" y1="194" x2="200" y2="244" marker-start="url(#a)" marker-end="url(#a)"/>
  <text class="muted" x="212" y="215" font-size="13">đọc luật</text>
  <text class="muted" x="212" y="233" font-size="13">ghi qua PR, bạn merge</text>

  <!-- Repo -->
  <rect class="card" x="16" y="250" width="368" height="196" rx="4"/>
  <text class="label" x="32" y="274">REPO THIENAI-WORKFLOW</text>
  <text class="mono head" x="32" y="306">profile/</text>
  <text x="140" y="306" font-size="14">luật và hồ sơ của bạn</text>
  <line class="sep" x1="32" y1="322" x2="368" y2="322"/>
  <text class="mono head" x="32" y="346">templates/</text>
  <text x="140" y="346" font-size="14">mẫu và lệnh dùng lại</text>
  <line class="sep" x1="32" y1="362" x2="368" y2="362"/>
  <text class="mono head" x="32" y="386">learning/</text>
  <text x="140" y="386" font-size="14">việc học, thẻ ôn</text>
  <line class="sep" x1="32" y1="402" x2="368" y2="402"/>
  <text class="mono head" x="32" y="426">docs/</text>
  <text x="140" y="426" font-size="14">tiến độ và kế hoạch</text>

  <!-- outputs -->
  <path class="line" d="M108 446 V496" marker-end="url(#a)"/>
  <path class="line" d="M292 446 V496" marker-end="url(#a)"/>
  <text class="muted" x="118" y="476" font-size="12">một lệnh dựng lại</text>
  <text class="muted" x="302" y="476" font-size="12">tự đồng bộ</text>

  <rect class="card" x="16" y="502" width="180" height="78" rx="4"/>
  <text x="32" y="531" font-size="14.5" font-weight="600">Trang claude.ai</text>
  <text class="muted" x="32" y="551" font-size="12.5">bài học, tổng quan,</text>
  <text class="muted" x="32" y="567" font-size="12.5">lộ trình học</text>

  <rect class="card" x="204" y="502" width="180" height="78" rx="4"/>
  <text x="220" y="531" font-size="14.5" font-weight="600">Project khác</text>
  <text class="muted" x="220" y="551" font-size="12.5">sakubun, tiktok nhận</text>
  <text class="muted" x="220" y="567" font-size="12.5">luật chung AGENTS.md</text>
</svg>
