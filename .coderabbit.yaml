# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# CodeRabbit cho repo thienai-workflow. Cách dùng và lý do: docs/decisions/002-coderabbit-one-review.md
# Tóm tắt: PR mở ở dạng nháp trong lúc làm (CodeRabbit bỏ qua), xong và test qua mới chuyển sẵn sàng rồi gọi
# "@coderabbitai review" một lần. Không review lại sau mỗi lần đẩy; bản sửa lớn thì gọi lại bằng tay.
reviews:
  profile: chill
  auto_review:
    enabled: true
    drafts: false                    # PR nháp: không review
    auto_incremental_review: false   # không tự review lại sau mỗi lần đẩy; gọi "@coderabbitai review" khi cần
  path_filters:
    # Nhật ký học, thẻ ôn, lộ trình, số liệu dùng tính năng: nội dung do buổi học ghi lại, không phải code.
    - "!learning/ba.md"
    - "!learning/frontend.md"
    - "!learning/war.md"
    - "!learning/cards.md"
    - "!learning/roadmap.md"
    - "!learning/usage.md"
    - "!learning/glossary.md"
