# Gemini Code Assist cho repo thienai-workflow. Cách dùng và lý do: docs/decisions/002-coderabbit-one-review.md
# Giống CodeRabbit: không review PR nháp, review một lần khi PR sẵn sàng; sửa lớn thì comment "/gemini review".
# Không tóm tắt PR vì CodeRabbit đã tóm tắt.
have_fun: false
ignore_patterns:
  # Nhật ký học, thẻ ôn, lộ trình, số liệu dùng tính năng: nội dung ghi sau buổi học, không phải code.
  - learning/ba.md
  - learning/frontend.md
  - learning/war.md
  - learning/cards.md
  - learning/roadmap.md
  - learning/usage.md
  - learning/glossary.md
code_review:
  disable: false
  comment_severity_threshold: MEDIUM
  max_review_comments: -1
  pull_request_opened:
    help: false
    summary: false
    code_review: true
    include_drafts: false
