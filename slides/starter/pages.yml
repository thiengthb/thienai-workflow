# Copy to .github/workflows/slides.yml in the project repo, then in GitHub: Settings > Pages > Source: GitHub Actions.
# Checks and publishes every deck under slides/ (HTML, CSS, JS, fonts, images) with a PDF made by check.mjs.
# A deck with a check ERROR stops the publish.
name: Slides
on:
  push:
    branches: [main]
    paths: ['slides/**', '.github/workflows/slides.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slides
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check every deck, export PDFs, collect site
        # Every slides/**/deck.html is one deck. slides/deck.html is served at the site root,
        # slides/<name>/deck.html at /<name>/. Each deck folder is copied whole (CSS, JS, assets).
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          mkdir -p site
          for deck in $(find slides -name deck.html -not -path '*/check/*' -not -path '*/node_modules/*'); do
            dir=$(dirname "$deck"); rel=${dir#slides}; rel=${rel#/}
            node slides/check.mjs "$deck" --pdf
            mkdir -p "site/$rel"
            rsync -a --exclude check --exclude node_modules --exclude '*.mjs' "$dir/" "site/$rel/"
            cp "$dir/check/deck.pdf" "site/$rel/deck.pdf"
            cp "site/$rel/deck.html" "site/$rel/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
