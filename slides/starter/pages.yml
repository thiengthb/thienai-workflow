# Copy to .github/workflows/slides.yml in the project repo, then in GitHub: Settings > Pages > Source: GitHub Actions.
# Publishes the slides/ folder (HTML, CSS, JS, fonts, images) and a PDF made by check.mjs.
name: Slides
on:
  push:
    branches: [main]
    paths: ['slides/**', '.github/workflows/slides.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: slides
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check slides and export PDF
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          node slides/check.mjs slides/deck.html --pdf
      - name: Collect site
        run: |
          mkdir -p site
          cp -r slides/deck.html slides/deck.css slides/deck.js slides/assets site/
          cp slides/check/deck.pdf site/deck.pdf
          cp site/deck.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
